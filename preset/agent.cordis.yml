# dsh-eco-router — token-efficient model-routing flywheel.
#
# Consumes host services (`agents`, `fs`, `tools`) and publishes no service of
# its own, so it sits loose (outside any isolate realm) like tool-bash/tool-goal.
# Remove `disabled` once `@joyfoxai/dsh-eco-router` is installed/resolvable.
- id: dsh-eco-router
  name: '@joyfoxai/dsh-eco-router'
  config:
    tiers: [deepseek-v4-flash, deepseek-v4-pro]   # cheapest first
    autoRoute: false                               # true → override at agent/request
